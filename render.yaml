# Render Blueprint for live wobo.is (hks-portfolio, branch `main`).
# Render serves only ./public, which scripts/publish.mjs fills with the site files.
# package.json, scripts/, content/ (drafts), render.yaml and *.md are never published.
services:
  - type: web
    name: hks-portfolio
    runtime: static
    branch: main
    buildCommand: node scripts/publish.mjs
    staticPublishPath: public
    pullRequestPreviewsEnabled: false
    domains:
      - wobo.is
      - www.wobo.is
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /404.html
        name: X-Robots-Tag
        value: noindex, follow
